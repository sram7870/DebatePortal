<head>
    <title>Dashboard</title>
    <script src="{{ url_for('static', filename='dashScript.js') }}"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        offwhite: '#f8f8f5',
                    },
                    fontFamily: {
                        custom: ['Futura', 'Trebuchet MS', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet" />
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Trebuchet MS"', 'Helvetica', 'sans-serif']
                    },
                    colors: {
                        primaryGreen: {
                            DEFAULT: '#256d3b',
                            light: '#4a9867',
                            dark: '#1d502a',
                        },
                        offwhite: '#f8faf6',
                        calmGray: {
                            light: '#e6e8e3',
                            DEFAULT: '#9ca3af',
                            dark: '#6b7280',
                        }
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: 0, transform: 'translateY(10px)' },
                            '100%': { opacity: 1, transform: 'translateY(0)' }
                        }
                    },
                    animation: {
                        fadeIn: 'fadeIn 0.5s ease-out forwards'
                    }
                }
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='chatbot.js') }}"></script>

    <style>
        body {
            background-color: #f8faf6;
            font-family: "Trebuchet MS", Helvetica, sans-serif;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none !important;
        }
        #editor {
            height: 280px;
            background: white;
            border: 1px solid #9ca3af;
            border-radius: 0.5rem;
            padding: 0.5rem;
            overflow-y: auto;
        }
        .mood-btn {
            border-radius: 9999px;
            border: 2px solid transparent;
            cursor: pointer;
            padding: 0.5rem 0.75rem;
            font-size: 1.5rem;
            transition: all 0.3s ease;
        }
        .mood-btn:hover {
            transform: scale(1.1);
        }
        .mood-btn.selected {
            border-color: #256d3b;
            background-color: #d1fae5;
        }
        input[type="date"]::-webkit-calendar-picker-indicator {
            /* You may need to use background-image to create a green highlight effect */
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="15" viewBox="0 0 24 24"><path fill="green" d="M20 3h-1V1h-2v2H7V1H5v2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 18H4V8h16v13z"/><path fill="white" d="M9 10h1v1H9v-1zM11 10h1v1h-1v-1zM13 10h1v1h-1v-1zM9 12h1v1H9v-1zM11 12h1v1h-1v-1zM13 12h1v1h-1v-1zM9 14h1v1H9v-1zM11 14h1v1h-1v-1zM13 14h1v1h-1v-1z"/></svg>') no-repeat;
            background-size: cover;
            cursor: pointer;
        }
    </style>
</head>

<body>

<!-- Navigation Bar -->
<nav class="flex items-center justify-between px-6 py-4 shadow-md bg-white">
    <div class="flex items-center space-x-4">
        <!-- Home Button with House Icon -->
        <a href="{{ url_for('dashboard') }}" class="flex items-center text-gray-800 hover:text-emerald-600">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-1" fill="none" viewBox="0 0 24 24"
                 stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M3 12l2-2m0 0l7-7 7 7M13 5v6h6m-6 0v8m-4 0h8" />
            </svg>
            <span class="font-medium">Home</span>
        </a>

        <!-- Vertical Divider -->
        <div class="h-6 border-l border-gray-400 rounded-full"></div>
    </div>

    <!-- Navigation Links -->
    <div class="flex space-x-6">
        <a href="#" class="text-gray-800 hover:text-emerald-600 font-medium">Past Debates</a>
        <a href="#" class="text-gray-800 hover:text-emerald-600 font-medium">Practice</a>
        <a href="/build" class="text-gray-800 hover:text-emerald-600 font-medium">Build</a>
        <a href="#" class="text-gray-800 hover:text-emerald-600 font-medium">In Debate</a>
    </div>
</nav>

<!-- Header -->
<header class="text-center mt-12 mb-8">
    <h1 class="text-4xl font-bold text-gray-800">
        Build Your Cases!
    </h1>
    <p class="text-lg mt-2">Utalize AI feedback and modern tools to acheive perfection!</p>
</header>

<div class="max-w-7xl mx-auto px-6 grid grid-cols-1 gap-8">

    <!-- NSDA Debates Section -->
    <section class="mb-16 px-4 md:px-16 animate-fade-in-up">
        <h2 class="text-3xl font-bold mb-6 text-gray-dark">Past NSDA Debates</h2>

        <!-- Add Debate Form -->
        <section class="bg-white rounded-3xl shadow-xl p-8 mb-10 transition-shadow duration-300 hover:shadow-2xl animate-fadeIn">
            <form action="/dashboard/add_debate" method="POST" class="grid gap-4">
                <div>
                    <label class="block mb-2 font-semibold text-primaryGreen-dark">Debate Title:</label>
                    <input name="title" type="text" placeholder="e.g., 'Round vs Glenbrook South'" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primaryGreen-light">
                </div>

                <div>
                    <label class="block mb-2 font-semibold text-primaryGreen-dark">Summary:</label>
                    <textarea name="summary" rows="3" placeholder="Brief description of the debate" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primaryGreen-light"></textarea>
                </div>

                <div>
                    <label class="block mb-2 font-semibold text-primaryGreen-dark">Date:</label>
                    <input name="date" type="date" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primaryGreen-light">
                </div>

                <div>
                    <label class="block mb-2 font-semibold text-primaryGreen-dark">Side:</label>
                    <select name="side" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primaryGreen-light">
                        <option value="">Select Side</option>
                        <option value="Aff">Affirmative</option>
                        <option value="Neg">Negative</option>
                    </select>
                </div>

                <button type="submit" class="bg-primaryGreen-dark text-white px-6 py-2 rounded-xl hover:bg-primaryGreen transition mt-4">Add Debate</button>
            </form>
        </section>

        <!-- Search Field -->
        <input id="debateSearch" type="text" placeholder="🔍 Search debates by title or side..." class="w-full mb-8 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primaryGreen-light">

        <!-- Debate Cards Grid -->
        <div id="debateList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            {% for debate in debates %}
            <div class="debate-item bg-white rounded-3xl shadow-md p-6 relative transition hover:shadow-xl" data-title="{{ debate.title | lower }}" data-side="{{ debate.side | lower }}">
                <div class="flex flex-col gap-2">
                    <h3 class="text-xl font-semibold text-gray-800">{{ debate.title }}</h3>
                    <p class="text-gray-600 text-sm italic">{{ debate.summary }}</p>
                    <span class="inline-block px-3 py-1 rounded-full text-xs font-medium mt-1
                        {% if debate.side == 'Aff' %}
                            bg-green-100 text-green-700
                        {% else %}
                            bg-red-100 text-red-700
                        {% endif %}
                    ">
                        {{ debate.side }}
                    </span>
                    <span class="text-sm text-gray-500 mt-1">{{ debate.date }}</span>
                </div>

                <!-- View Full Analysis Button -->
                <a href="/analysis/{{ debate.id }}" class="absolute top-3 right-3 text-primaryGreen-dark hover:underline text-sm">View</a>

                <!-- Delete Form -->
                <form action="/dashboard/delete_debate/{{ debate.id }}" method="POST" class="mt-4">
                    <button type="submit" class="text-red-500 hover:text-red-700 text-sm">🗑 Delete</button>
                </form>
            </div>
            {% endfor %}
        </div>
    </section>
</div>

</div>
</body>
